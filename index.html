<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Súper Inteligente con IA</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f4f6f9; color: #2d3748; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h2 { color: #1a202c; text-align: center; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #059669; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background-color: #f7fafc; }
        .sobrante { color: #dd6b20; font-size: 13px; font-weight: bold; }
        .chat-bubble { background: #ebf8ff; border-left: 4px solid #3182ce; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white; margin: 0; }
            .card { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="no-print">🛒 Mi Generador de Compra Inteligente 1.1.5</h1>
        
        <!-- Ventana interactiva de preguntas de la IA -->
        <div id="ia-chat" class="chat-bubble no-print">
            <p id="ia-mensaje" style="margin:0 0 10px 0; font-weight:500; color:#2b6cb0;"></p>
        </div>

        <div class="no-print">
            <label for="peticion">¿Qué te gustaría cocinar esta semana?</label>
            <textarea id="peticion" placeholder="Ej: Hola! Esta semana quiero preparar la gelatina con yogur..."></textarea>
            
            <div style="display:flex; gap:15px;">
                <div style="flex:1;">
                    <label for="dias">📅 ¿Días?</label>
                    <input type="number" id="dias" value="7">
                </div>
                <div style="flex:1;">
                    <label for="personas">👥 ¿Personas?</label>
                    <input type="number" id="personas" value="2">
                </div>
            </div>
            <button id="btn-calcular" onclick="solicitarListaDeCompra()">Generar Lista con IA 🚀</button>
        </div>

        <div id="resultado" style="display:none; margin-top:30px;">
            <h2>📋 Tu Plan de Compra Oficial</h2>
            <p id="meta-recetas" style="font-weight:bold; color:#2b6cb0;"></p>
            
            <table>
                <thead>
                    <tr>
                        <th>Ingrediente</th>
                        <th>Cantidad Neta</th>
                        <th>¿Qué comprar?</th>
                        <th>Sobrante</th>
                        <th>Lugar</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo"></tbody>
            </table>
            
            <button class="no-print" style="background:#3182ce; margin-top:25px;" onclick="window.print()">Imprimir Lista de Compras 🖨️</button>
        </div>
    </div>

    <script>
        // 🔗 URL REPARADA (Se eliminó la letra E accidental al final)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx70O4NjE29eXYK2yr91AzZsUVae-ih2uDrmWi2EMqXpGpya3fTjFvWdFNb9gUgQlSWiA/exec"; 

        function solicitarListaDeCompra() {
            const peticion = document.getElementById('peticion').value.trim();
            const dias = document.getElementById('dias').value;
            const personas = document.getElementById('personas').value;
            const btn = document.getElementById('btn-calcular');

            if (!peticion) return alert("Por favor, escribe lo que deseas comer.");

            btn.innerText = "La IA está procesando tu solicitud... ⏳";
            btn.disabled = true;
            document.getElementById('ia-chat').style.display = "none";

            const scriptViejo = document.getElementById('jsonp-script-interactivo');
            if (scriptViejo) scriptViejo.remove();

            const urlFinal = `${GOOGLE_SCRIPT_URL}?peticion=${encodeURIComponent(peticion)}&dias=${dias}&personas=${personas}&callback=procesarRespuestaInteractiva&_ts=${Date.now()}`;

            const script = document.createElement('script');
            script.id = 'jsonp-script-interactivo';
            script.src = urlFinal;
            script.onerror = function() {
                alert("Error de conexión con tu Google Sheet.");
                btn.innerText = "Generar Lista con IA 🚀";
                btn.disabled = false;
            };
            document.body.appendChild(script);
        }

        function procesarRespuestaInteractiva(respuesta) {
            const btn = document.getElementById('btn-calcular');
            btn.innerText = "Generar Lista con IA 🚀";
            btn.disabled = false;

            if (!respuesta.success) return alert("Error del servidor: " + respuesta.error);

            if (respuesta.status === "pregunta") {
                document.getElementById('ia-mensaje').innerText = "🤖 Asistente: " + respuesta.mensaje;
                document.getElementById('ia-chat').style.display = "block";
                document.getElementById('resultado').style.display = "none";
                return;
            }

            if (!respuesta.lista || respuesta.lista.length === 0) {
                document.getElementById('meta-recetas').innerText = "❌ No se encontraron ingredientes para esa receta en tu Google Sheet.";
                document.getElementById('tabla-cuerpo').innerHTML = "";
                document.getElementById('resultado').style.display = 'block';
                return;
            }

            document.getElementById('meta-recetas').innerText = `🥗 Platos identificados: ${respuesta.recetasDetectadas.join(', ')}`;

            const cuerpo = document.getElementById('tabla-cuerpo');
            cuerpo.innerHTML = "";

            respuesta.lista.forEach(item => {
                // 🛠️ ALINEACIÓN COMERCIAL: Muestra empaques en gramos exactos (Ej: 1 x 2000 gramos)
                let textoCompra = `${item.paquetesAComprar} x ${item.empaqueMin} ${item.unidadCompra}`;
                
                // Si la unidad es por sobre o pieza simple, oculta los gramos repetidos para que diga "4 x sobre"
                if (item.unidadCompra.toLowerCase() === "sobre" || item.unidadCompra.toLowerCase() === "unidad") {
                    textoCompra = `${item.paquetesAComprar} x ${item.unidadCompra}`;
                }

                cuerpo.innerHTML += `
                    <tr>
                        <td><strong>${item.ingrediente}</strong></td>
                        <td>${item.cantidadNeta} ${item.unidad}</td>
                        <td><mark style="background:#d1fae5; padding:3px; font-weight:bold;">${textoCompra}</mark></td>
                        <td><span class="sobrante">${item.sobrante > 0 ? '+' + item.sobrante + ' ' + item.unidad : '0'}</span></td>
                        <td><span style="font-size:12px; background:#e2e8f0; padding:4px; border-radius:4px;">${item.lugar || 'Cualquiera'}</span></td>
                    </tr>
                `;
            });

            document.getElementById('resultado').style.display = 'block';
        }
    </script>
</body>
</html>
